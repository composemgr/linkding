# nginx proxy address - http://172.17.0.1:9090

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - linkding
    ports:
      - "9090:9090"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./rootfs/config/linkding:/config
      - ./rootfs/data/linkding:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  linkding:
    external: false
